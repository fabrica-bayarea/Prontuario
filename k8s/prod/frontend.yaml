apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayarea-prontuario-frontend
  namespace: bayarea-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bayarea-prontuario-frontend
  template:
    metadata:
      labels:
        app: bayarea-prontuario-frontend
    spec:
      containers:
        - name: frontend
          image: 248189947068.dkr.ecr.us-east-1.amazonaws.com/bayarea-prontuario-frontend-prod:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bayarea-prontuario-frontend
  namespace: bayarea-web
spec:
  selector:
    app: bayarea-prontuario-frontend
  ports:
    - port: 80
      targetPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayarea-prontuario-backend
  namespace: bayarea-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bayarea-prontuario-backend
  template:
    metadata:
      labels:
        app: bayarea-prontuario-backend
    spec:
      containers:
        - name: backend
          image: 248189947068.dkr.ecr.us-east-1.amazonaws.com/bayarea-prontuario-backend-prod:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-prontuario
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: rds-prontuario
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-prontuario
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rds-prontuario
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-prontuario
                  key: DB_PASSWORD
            - name: DB_SSL
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: bayarea-prontuario-backend
  namespace: bayarea-web
spec:
  selector:
    app: bayarea-prontuario-backend
  ports:
    - port: 3001
      targetPort: 3001

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bayarea-cicd
  namespace: bayarea-web
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bayarea-cicd-binding
  namespace: bayarea-web
subjects:
  - kind: Group
    name: bayarea-cicd
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: bayarea-cicd
  apiGroup: rbac.authorization.k8s.io

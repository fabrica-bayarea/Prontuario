name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
    paths:
      - 'backEnd/**'
      - 'frontEnd/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backEnd/**'
      - 'frontEnd/**'

env:
  NODE_VERSION: "20"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

permissions:
  contents: read
  id-token: write

jobs:
  # ─── DETECT CHANGES ─────────────────────────────────
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backEnd/**'
            frontend:
              - 'frontEnd/**'

  # ─── FRONT-END CI ───────────────────────────────────
  frontend-ci:
    name: "FrontEnd: Lint + Build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build

  # ─── BACK-END CI ────────────────────────────────────
  backend-ci:
    name: "BackEnd: TypeCheck"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backEnd/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ─── DOCKER BUILD BACKEND (DEV) ─────────────────────
  docker-backend-dev:
    name: "Docker: Backend (dev)"
    needs: [changes, backend-ci]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend-ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-backend-dev:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backEnd
          file: ./backEnd/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-backend-dev:latest

  # ─── DOCKER BUILD FRONTEND (DEV) ────────────────────
  docker-frontend-dev:
    name: "Docker: Frontend (dev)"
    needs: [changes, frontend-ci]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend-ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-frontend-dev:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./frontEnd
          file: ./frontEnd/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=/prontuario-dev/api
            VITE_BASE=/prontuario-dev/
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-frontend-dev:latest

  # ─── DEPLOY BACKEND (DEV) ───────────────────────────
  deploy-backend-dev:
    name: "Deploy Backend (dev)"
    needs: docker-backend-dev
    if: needs.docker-backend-dev.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/bayarea-prontuario-backend-dev \
            backend=${{ needs.docker-backend-dev.outputs.tag }} -n bayarea-web
          kubectl rollout status deployment/bayarea-prontuario-backend-dev -n bayarea-web --timeout=300s

  # ─── DEPLOY FRONTEND (DEV) ──────────────────────────
  deploy-frontend-dev:
    name: "Deploy Frontend (dev)"
    needs: docker-frontend-dev
    if: needs.docker-frontend-dev.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/bayarea-prontuario-frontend-dev \
            frontend=${{ needs.docker-frontend-dev.outputs.tag }} -n bayarea-web
          kubectl rollout status deployment/bayarea-prontuario-frontend-dev -n bayarea-web --timeout=300s

  # ─── DOCKER BUILD BACKEND (PROD) ────────────────────
  docker-backend-prod:
    name: "Docker: Backend (prod)"
    needs: [changes, backend-ci]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend-ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-backend-prod:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backEnd
          file: ./backEnd/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-backend-prod:latest

  # ─── DOCKER BUILD FRONTEND (PROD) ───────────────────
  docker-frontend-prod:
    name: "Docker: Frontend (prod)"
    needs: [changes, frontend-ci]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend-ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-frontend-prod:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./frontEnd
          file: ./frontEnd/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=/prontuario/api
            VITE_BASE=/prontuario/
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/bayarea-prontuario-frontend-prod:latest

  # ─── DEPLOY BACKEND (PROD) ──────────────────────────
  deploy-backend-prod:
    name: "Deploy Backend (prod)"
    needs: docker-backend-prod
    if: needs.docker-backend-prod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/bayarea-prontuario-backend \
            backend=${{ needs.docker-backend-prod.outputs.tag }} -n bayarea-web
          kubectl rollout status deployment/bayarea-prontuario-backend -n bayarea-web --timeout=300s

  # ─── DEPLOY FRONTEND (PROD) ─────────────────────────
  deploy-frontend-prod:
    name: "Deploy Frontend (prod)"
    needs: docker-frontend-prod
    if: needs.docker-frontend-prod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BAYAREA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/bayarea-prontuario-frontend \
            frontend=${{ needs.docker-frontend-prod.outputs.tag }} -n bayarea-web
          kubectl rollout status deployment/bayarea-prontuario-frontend -n bayarea-web --timeout=300s

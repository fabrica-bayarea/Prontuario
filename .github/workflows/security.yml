name: Security Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Permissões mínimas no nível do workflow; cada job eleva o que precisa.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # SAST — CodeQL (JavaScript/TypeScript)
  # ALTERADO: matrix ['javascript','typescript'] -> linguagem única.
  # No CodeQL as duas usam o MESMO extrator (javascript-typescript);
  # a matrix rodava a análise idêntica 2x. Corte de ~50% do job.
  # =========================================================
  sast-codeql:
    name: SAST · CodeQL
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backEnd/package-lock.json
            frontEnd/package-lock.json

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Rodar CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: true

      # REMOVIDO: bloco "Checar severidade no SARIF" (~40 linhas de jq).
      # O gate passa a ser nativo: branch protection rule
      # "Require code scanning results" bloqueia o merge.
      # Ref: https://docs.github.com/en/code-security/code-scanning

  # =========================================================
  # SCA — Segredos (Gitleaks)
  # CORRIGIDO: --exit-code 0 -> 1. Antes o step NUNCA falhava,
  # logo o "Security Gate" que marcava Gitleaks como BLOCKING
  # era decorativo.
  # =========================================================
  secrets-scan:
    name: SCA · Segredos (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.27.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          mkdir -p reports

      # Passada 1 — SARIF para o Code Scanning (não falha aqui)
      - name: Gitleaks · SARIF
        run: |
          gitleaks dir . \
            --redact \
            --report-format sarif \
            --report-path reports/gitleaks.sarif \
            --exit-code 0

      # Passada 2 — HTML visual (equivalente ao relatório do ZAP)
      - name: Gitleaks · Relatório HTML
        run: |
          gitleaks dir . \
            --redact \
            --report-format template \
            --report-template .github/security/gitleaks-report.tmpl \
            --report-path reports/gitleaks-report.html \
            --exit-code 0

      - name: Upload SARIF (Code Scanning)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Resumo no Job Summary
        if: always()
        run: |
          COUNT=$(jq '[.runs[].results[]?] | length' reports/gitleaks.sarif)
          {
            echo "## 🔑 Gitleaks — Detecção de Segredos"
            echo ""
            echo "**Total de achados:** ${COUNT}"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "| Risco | Regra | Arquivo | Linha |"
              echo "|---|---|---|---|"
              jq -r '.runs[].results[]? |
                "| 🔴 CRITICAL | \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) |"' \
                reports/gitleaks.sarif
            else
              echo "✅ Nenhum segredo detectado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/
          retention-days: 30

      # Gate nativo — sem script Bash intermediário
      - name: Security Gate (Gitleaks)
        run: gitleaks dir . --redact --no-banner --exit-code 1

  # =========================================================
  # SCA — Dependency Review
  # ALTERADO: saiu de dentro do job "security", virou job próprio.
  # Removido o `continue-on-error: true` — antes não bloqueava nada
  # e nem era avaliado pelo Security Gate.
  # =========================================================
  dependency-review:
    name: SCA · Dependências (Dependency Review)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0
          retry-on-snapshot-warnings: true

  # =========================================================
  # SCA — SBOM (CycloneDX) + análise de vulnerabilidades
  # ALTERADO: roda SOMENTE em push na main.
  # NOVO: bomber enriquece o SBOM contra a base OSV e gera HTML
  # com severidade — o SBOM sozinho é inventário, não tem risco.
  # =========================================================
  sbom:
    name: SCA · SBOM (CycloneDX + bomber)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/sbom.cdx.json

      - name: Instalar bomber
        run: |
          URL=$(curl -sSL https://api.github.com/repos/devops-kung-fu/bomber/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_amd64.deb$")) | .browser_download_url')
          curl -sSL -o bomber.deb "$URL"
          sudo dpkg -i bomber.deb

      - name: Analisar SBOM · HTML + JSON
        run: |
          bomber scan reports/sbom.cdx.json --provider=osv \
            --output=html --output-file=reports/sbom-vulns.html || true
          bomber scan reports/sbom.cdx.json --provider=osv \
            --output=json --output-file=reports/sbom-vulns.json || true

      - name: Resumo no Job Summary
        if: always()
        run: |
          {
            echo "## 📦 SBOM — Vulnerabilidades em Dependências"
            echo ""
            echo "| Risco | Pacote | Identificador | CVSS |"
            echo "|---|---|---|---|"
            jq -r '.packages[]? as $p | $p.vulnerabilities[]? |
              "| \(.severity) | \($p.purl) | \(.cve // .id) | \(.cvss3Score // "-") |"' \
              reports/sbom-vulns.json 2>/dev/null \
              || echo "| — | — | sem achados | — |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/
          retention-days: 30

      # Gate nativo — exit code reflete a maior severidade encontrada
      - name: Security Gate (SBOM)
        run: |
          bomber scan reports/sbom.cdx.json --provider=osv \
            --severity=high --exitcode

  # =========================================================
  # DAST BASELINE — inalterado
  # =========================================================
  dast_baseline_scan:
    name: DAST ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://bayarea.dataiesb.com/prontuario-dev/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >-
            -m 5
            -a
            -z "-config spider.handleParameters=IGNORE_VALUE
                -config globalexcludeurl.url_list.url\(0\).regex='^https?://bayarea\.dataiesb\.com/(?!prontuario-dev(?:/|$)).*$'
                -config globalexcludeurl.url_list.url\(0\).description='Fora do escopo prontuario-dev'
                -config globalexcludeurl.url_list.url\(0\).enabled=true"
          fail_action: true
          allow_issue_writing: false

      - name: Upload Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

  # =========================================================
  # DAST FULL SCAN — inalterado
  # =========================================================
  dast_full_scan:
    name: DAST ZAP Full Scan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://bayarea.dataiesb.com/prontuario-dev/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >-
            -m 10
            -j
            -a
            -z "-config spider.handleParameters=IGNORE_VALUE
                -config globalexcludeurl.url_list.url\(0\).regex='^https?://bayarea\.dataiesb\.com/(?!prontuario-dev(?:/|$)).*$'
                -config globalexcludeurl.url_list.url\(0\).description='Fora do escopo prontuario-dev'
                -config globalexcludeurl.url_list.url\(0\).enabled=true"
          allow_issue_writing: false
          artifact_name: 'zap_full_report'

      - name: Upload Full Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

# =============================================================
# REMOVIDO NESTA REFATORAÇÃO — job "security" inteiro:
#   - Setup Node + 2 caches + npm ci (backEnd e frontEnd)
#   - npm test --coverage (existia só para alimentar o lcov do Sonar)
#   - npm audit (backEnd e frontEnd)
#   - Trivy filesystem scan + upload SARIF
#   - Semgrep (pip install + scan) + upload SARIF
#   - SonarCloud Scan (com sonar.qualitygate.wait=true)
#   - Security Gate (script Bash, ~60 linhas)
#   - Dependency Review inline (promovido a job próprio)
# =============================================================
